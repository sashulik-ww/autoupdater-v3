name: AI advisor

on:
  workflow_dispatch:
  # Автозапуск отключён по умолчанию; при желании включите расписание:
  # schedule:
  #   - cron: "0 6 * * 1"

permissions:
  contents: write

concurrency:
  group: ai-advisor
  cancel-in-progress: false

jobs:
  advise:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Analyze working configs with Claude
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python ai_advisor.py

      - name: Commit verified suggestions and report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sources_ai.txt ai_domains.txt out/ai_report.md 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No AI suggestions or report changes"
            exit 0
          fi
          git commit -m "Update Claude AI suggestions"
          git pull --rebase --autostash
          git push
