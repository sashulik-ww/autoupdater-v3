name: Check proxies

on:
  schedule:
    - cron: "0 */2 * * *"   # каждые 2 часа
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: proxy-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Xray-core
        run: |
          mkdir -p "$HOME/xray" && cd "$HOME/xray"
          curl -fsSL --retry 3 -o xray.zip \
            "https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip"
          unzip -q -o xray.zip xray
          chmod +x xray
          ./xray version
          echo "XRAY_BIN=$HOME/xray/xray" >> "$GITHUB_ENV"

      - name: Install sing-box
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/singbox"
          cd "$HOME/singbox"

          API_URL="https://api.github.com/repos/SagerNet/sing-box/releases/latest"
          RELEASE_JSON=$(curl --fail --silent --show-error --location \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            "$API_URL")

          URL=$(printf '%s' "$RELEASE_JSON" | jq -r '
            [.assets[].browser_download_url
              | select(test("linux-amd64.*\\.tar\\.gz$"))][0] // empty
          ')
          if [[ -z "$URL" || "$URL" == "null" ]]; then
            echo "Не найден Linux amd64 архив sing-box. Assets релиза:" >&2
            printf '%s' "$RELEASE_JSON" | jq -r '.assets[].name' >&2 || true
            exit 1
          fi

          echo "Downloading sing-box archive"
          curl --fail --silent --show-error --location --retry 3 -o sb.tar.gz "$URL"
          mkdir -p extracted
          tar -xzf sb.tar.gz -C extracted
          BIN=$(find extracted -type f -name sing-box -print -quit)
          if [[ -z "$BIN" ]]; then
            echo "В архиве не найден бинарник sing-box" >&2
            exit 1
          fi
          install -m 0755 "$BIN" "$HOME/singbox/sing-box"
          "$HOME/singbox/sing-box" version
          echo "SINGBOX_BIN=$HOME/singbox/sing-box" >> "$GITHUB_ENV"

      - name: Check proxies
        env:
          TIMEOUT: "8"
          CONCURRENCY: "200"
          XRAY_WORKERS: "32"
          SINGBOX_WORKERS: "32"
          XRAY_TIMEOUT: "6"
          XRAY_START_TIMEOUT: "6"
          SPEED_TEST: "false"
          MAX_PER_COUNTRY: "18"
          MIN_SPEED_MBPS: "1.5"
          MAX_TESTS_PER_IP: "3"
          TELEGRAM_CHANNELS: "t.me/OutlineReleasedKey,t.me/V2ray_Collector"
          SOURCE_URLS: "https://raw.githubusercontent.com/nikita29a/FreeProxyList/refs/heads/main/mirror/1.txt, https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/Export/Base64/PROXIES_ONLY/BLACK_VLESS_RUS_base64.txt, https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/Export/Base64/PROXIES_ONLY/WHITE-SNI-RU-all-base64.txt, https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/Export/Base64/PROXIES_ONLY/BLACK_SS%2BAll_RUS_base64.txt, https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/Export/Base64/PROXIES_ONLY/WHITE-CIDR-RU-all-base64.txt, https://raw.githubusercontent.com/barry-far/V2ray-Config/refs/heads/main/All_Configs_base64_Sub.txt"
        run: python checker.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A results
          if git diff --cached --quiet; then
            echo "Нет изменений"
            exit 0
          fi

          git commit -m "Update proxies: $(date -u +'%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3 4 5; do
            echo "Попытка пуша №$i..."
            git fetch origin main
            if git rebase -X theirs --autostash origin/main; then
              if git push origin HEAD:main; then
                echo "Успешно запушено"
                exit 0
              fi
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 4))
          done
          echo "Не удалось запушить"
          exit 1
